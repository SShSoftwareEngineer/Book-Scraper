[project]
name = "book-scraper"
version = "0.1.0"
description = "Book scraper with Celery + Redis + Playwright"
authors = [
    { name = "Common", email = "shypulin@ukr.net" }
]
requires-python = ">=3.10,<4.0"

dependencies = [
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "playwright (>=1.59.0,<2.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "celery (>=5.4.0,<6.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "booktype (>=1.5,<2.0)",
    "redis (>=8.0.0,<9.0.0)",
]

[dependency-groups]
dev = [
    "pylint (>=4.0.0,<5.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "types-psycopg2 (>=2.9.0,<3.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "flower (>=2.0.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

#----- PyLint config -----

[tool.pylint.format]
max-line-length = 120

[tool.pylint.master]
ignore-paths = [
    "^\\.venv/.*$",
    "^Notes/.*$",
]

[tool.pylint.messages_control]
disable = [
    "fixme",  # Отключает предупреждения для TODO, FIXME и XXX (W0511)
]

#----- MyPy config -----

[tool.mypy]
python_version = "3.14"
exclude = [
    '^.venv/',
    '^Notes/',
]

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "psycopg2.*",
    "celery.*",
    "redis.*"
]
ignore_missing_imports = true
